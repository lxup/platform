# SOPS encryption rules for this repo.
#
# The SAME Age key pair as lxup/homelab, deliberately: this repo is the
# split-out platform half of what used to be one repo, and talsecret.sops.yaml
# moved here already encrypted to that recipient. Re-keying would mean
# regenerating Talos secrets, i.e. rebuilding the cluster — pointless.
#
# Generated with `age-keygen -o ~/.config/sops/age/keys.txt` (cli/'s install
# step does this automatically on a fresh machine). This file only ever holds
# the PUBLIC key — the private key must never be committed and must be backed
# up somewhere safe outside git.
#
# Tenants do NOT share this key. Each tenant repo owns its own secret
# scheme (homelab: its own SOPS key; recomend/pave: Infisical + ESO) and
# this key never leaves the platform.
keys:
  - &platform age1xze49rtd29dpev58l3lsddpm986nk2vxh7pg4u7sy06rtnt82upszgkx5r

creation_rules:
  # Talos cluster secrets (certs, tokens) generated by talhelper.
  - path_regex: talos/talsecret\.sops\.yaml$
    key_groups:
      - age:
          - *platform

  # Any Kubernetes secret manifest, anywhere under kubernetes/, named
  # *.sops.yaml — keep secrets in their own file so plain manifests stay
  # cleartext and diff-friendly.
  - path_regex: kubernetes/.*\.sops\.ya?ml$
    key_groups:
      - age:
          - *platform

  # Bootstrap-time Helm values that carry a secret. Not a Kubernetes
  # manifest, so it can't go through ksops: cli/ decrypts it on the fly and
  # hands it to `helm upgrade` as an extra --values file.
  - path_regex: bootstrap/.*\.sops\.ya?ml$
    key_groups:
      - age:
          - *platform
