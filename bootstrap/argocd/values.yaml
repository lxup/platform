# One-shot `helm install` values for the PLATFORM ArgoCD ("ArgoCD #0"),
# applied imperatively by cli/ before GitOps exists to manage anything
# (chicken-and-egg). Re-running `helm upgrade --install` with this file is
# how you upgrade it later — its own Deployment is deliberately NOT managed
# by a GitOps Application, so a bad sync can never take down the thing
# doing the syncing. Nothing about it is GitOps-managed at all, in fact:
# the platform exposes no HTTP, so there is no Ingress either.
#
# SCOPE: this instance owns kubernetes/platform/ and kubernetes/tenants/
# ONLY — the real cluster's infra and the vcluster definitions. It never
# syncs a tenant's workloads: each tenant runs its own ArgoCD *inside* its
# vcluster, against its own repo. Keep it that way; the moment this
# instance starts syncing tenant apps, the tenant boundary is gone.
#
# IMPORTANT: the `sops-age` Secret this file mounts must already exist in
# the `argocd` namespace before this is applied, or the repo-server pod
# hangs forever on a missing volume mount (helm's --wait times out). The
# CLI creates it first for exactly this reason — see src/steps/10-sops-secret.ts.
# No TLS and no Ingress, deliberately and permanently: the platform runs no
# ingress controller and no cert-manager — those belong to a tenant (see the
# README). This UI is reached with
# `kubectl -n argocd port-forward svc/argocd-server 8080:80`, which is fine
# for something opened a few times a month, and it means the controller of
# the entire cluster has no path from the internet at all.
server:
  insecure: true
  extraArgs:
    - --insecure

configs:
  cm:
    # --enable-helm: inflate `helmCharts:` blocks (used by every service
    #   under kubernetes/platform/services/ and by the vcluster releases
    #   under kubernetes/tenants/services/).
    # --enable-alpha-plugins + --enable-exec: required for the ksops exec
    #   KRM function (ksops-generator.yaml) to run at all.
    kustomize.buildOptions: "--enable-helm --enable-alpha-plugins --enable-exec"

# No GitHub webhook here, unlike the old single-repo setup: with no Ingress,
# GitHub cannot reach this instance. The platform repo changes rarely —
# Talos/Cilium/Longhorn bumps, a new tenant — so ArgoCD's default 3-minute
# polling is plenty, and not punching a hole to the internet for the thing
# that controls the whole cluster is a straight win. Hit Refresh in the UI
# if you are impatient.
#
# Tenants are unaffected: each exposes its own ArgoCD through its own
# ingress, so the homelab tenant keeps argocd.nvlab.fr and its webhook.

# ksops (https://github.com/viaduct-ai/kustomize-sops) lets `kustomize
# build` decrypt SOPS-encrypted YAML inline via a `ksops-generator.yaml`
# next to the secret, instead of committing cleartext. Only the `ksops`
# binary is installed onto PATH — NOT `--with-kustomize`, which would
# replace the repo-server's own kustomize with the one bundled in the
# ksops image; that one's built against a different `helm` CLI interface
# than ArgoCD ships and crashes on `helm version -c --short`. The Age
# *private* key to actually decrypt comes from the `sops-age` Secret (see
# above), never from this file.
repoServer:
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: sops-age

  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1
      command: ["/usr/local/bin/ksops", "install", "/custom-tools"]
      volumeMounts:
        - name: custom-tools
          mountPath: /custom-tools

  volumeMounts:
    - name: custom-tools
      mountPath: /usr/local/bin/ksops
      subPath: ksops
    - name: sops-age
      mountPath: /.config/sops/age

  env:
    - name: XDG_CONFIG_HOME
      value: /.config
    - name: SOPS_AGE_KEY_FILE
      value: /.config/sops/age/keys.txt
