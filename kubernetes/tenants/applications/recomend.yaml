# Creates the EMPTY cluster and its guardrails — nothing more. What runs
# inside comes from recomendapp/infra, synced by that repo's own ArgoCD, which lives in
# this vcluster. The platform never reads it.
#
# Once synced, vcluster publishes the tenant's kubeconfig as the Secret
# `vc-recomend` in the `recomend` namespace. `platform tenant` exports it; that
# file is what replaces the repo's old cluster-provisioning step.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-recomend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lxup/platform.git
    targetRevision: main
    path: kubernetes/tenants/services/recomend
  destination:
    server: https://kubernetes.default.svc
    namespace: recomend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The vcluster chart brings its own CRDs and a large RBAC surface.
      - ServerSideApply=true
  # Two fields nothing can reconcile, excluded so they stop showing as a
  # permanent OutOfSync that hides real drift: the syncer writes
  # service-cidr onto its own Service at runtime, and the ServiceMonitor CRD
  # defaults relabelings[].action to "replace", which the chart omits.
  # selfHeal above would otherwise retry them forever.
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /metadata/annotations/vcluster.loft.sh~1service-cidr
    - group: monitoring.coreos.com
      kind: ServiceMonitor
      jqPathExpressions:
        - .spec.endpoints[].relabelings[].action
