# Creates the EMPTY cluster and its guardrails — nothing more. What runs
# inside comes from recomendapp/infra, synced by that repo's own ArgoCD, which lives in
# this vcluster. The platform never reads it.
#
# Once synced, vcluster publishes the tenant's kubeconfig as the Secret
# `vc-recomend` in the `recomend` namespace. `platform tenant` exports it; that
# file is what replaces the repo's old cluster-provisioning step.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-recomend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lxup/platform.git
    targetRevision: main
    path: kubernetes/tenants/services/recomend
  destination:
    server: https://kubernetes.default.svc
    namespace: recomend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The vcluster chart brings its own CRDs and a large RBAC surface.
      - ServerSideApply=true
  # Fields nothing can ever reconcile. Excluded so they stop showing as a
  # permanent OutOfSync that hides real drift — and because selfHeal above
  # would otherwise re-sync them every few minutes, forever.
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        # Written onto its own Service by the syncer at runtime.
        - /metadata/annotations/vcluster.loft.sh~1service-cidr
        # The chart renders 0; the API server assigns a real port.
        - /spec/ports/0/nodePort
    - group: monitoring.coreos.com
      kind: ServiceMonitor
      jqPathExpressions:
        # Defaulted to "replace" by the CRD, omitted by the chart.
        - .spec.endpoints[].relabelings[].action
