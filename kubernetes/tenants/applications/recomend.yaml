# Creates the EMPTY cluster and its guardrails — nothing more. What runs
# inside comes from recomendapp/infra, synced by that repo's own ArgoCD, which lives in
# this vcluster. The platform never reads it.
#
# Once synced, vcluster publishes the tenant's kubeconfig as the Secret
# `vc-recomend` in the `recomend` namespace. `platform tenant` exports it; that
# file is what replaces the repo's old cluster-provisioning step.
#
# ┌──────────────────────────────────────────────────────────────────────┐
# │ DECLARED, NOT ACTIVATED. No syncPolicy.automated: it shows as        │
# │ OutOfSync and creates nothing until `argocd app sync tenant-recomend`.  │
# └──────────────────────────────────────────────────────────────────────┘
#
# Activating it, in order:
#   1. sync this               → empty vcluster + quota + limit range
#   2. in recomendapp/infra: swap its provisioning step for reading the vc-recomend
#      Secret, then run its installer — ArgoCD and its apps come up inside
#   3. only once it serves traffic through its own tunnel:
#      `hetzner-k3s delete`. The Hetzner cluster is the rollback.
# Give it automated sync once live, so it self-heals like homelab.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-recomend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lxup/platform.git
    targetRevision: main
    path: kubernetes/tenants/services/recomend
  destination:
    server: https://kubernetes.default.svc
    namespace: recomend
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # The vcluster chart brings its own CRDs and a large RBAC surface.
      - ServerSideApply=true
