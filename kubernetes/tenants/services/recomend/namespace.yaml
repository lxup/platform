# Host-side namespace for the `recomend` tenant: its vcluster control plane and
# every workload pod its syncer pushes down land here, which is what makes
# the ResourceQuota next to this file actually bite.
#
# PSA `privileged` deliberately. The tenant's own API server enforces PSA for
# its own namespaces; what reaches here is already-admitted pods carrying
# arbitrary securityContexts, and host-side `baseline` would reject them
# after the fact — the pod would exist in the vcluster and never appear on a
# node, which is a miserable failure to debug.
#
# So PSA is NOT the tenant boundary. The boundary is a separate API server
# and the quota. There is no network policy yet: see ../../NETWORK-POLICY.md.
apiVersion: v1
kind: Namespace
metadata:
  name: recomend
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
    platform.nvlab.fr/tenant: recomend
