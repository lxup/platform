# The companion a ResourceQuota needs. Once a quota constrains
# requests/limits for cpu and memory, Kubernetes REJECTS any pod that does
# not declare all four — and the rejection surfaces as a vcluster SyncError
# on the virtual pod, with nothing at all in `kubectl get pods -n recomend` on
# the host. These defaults are the safety net; apps that declare their own
# resources are unaffected.
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 512Mi
