# vcluster values. Schema: `helm show values loft/vcluster --version 0.37.6`
# — the layout changed substantially at 0.20, so do not copy snippets from
# older sources into this file.

sync:
  fromHost:
    # Required. The chart default `auto` only self-enables with the virtual
    # scheduler, which is off, so without this every PVC in the tenant sits
    # Pending. This is what makes `storageClassName: longhorn` work unchanged.
    storageClasses:
      enabled: true
      # Fake node, and it matters more here than anywhere: this tenant is
      # meant to run the Actions Runner Controller for a PUBLIC repo, so CI
      # jobs proposed by strangers execute in its namespace. Do not hand
      # them a map of the hardware.
    nodes:
      enabled: false
  toHost:
    # The tenant's Ingresses stay inside its vcluster and its own ingress
    # controller serves them. Syncing them to the host would make the
    # tenant's edge depend on a platform ingress controller, which is the
    # coupling this split exists to remove.
    ingresses:
      enabled: false

controlPlane:
  statefulSet:
    # Set explicitly because the chart's default of "" renders as a YAML
    # null, which the API server then defaults — leaving git and the live
    # object permanently different.
    imagePullPolicy: IfNotPresent

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 1Gi
      limits:
        cpu: "2"
        memory: 1Gi
        ephemeral-storage: 10Gi

    persistence:
      volumeClaim:
        # Holds the tenant's entire control-plane state. Losing it empties
        # its cluster — recoverable from its repo, but it has to be
        # re-bootstrapped. retentionPolicy keeps it through a prune.
        enabled: true
        storageClass: longhorn
        size: 10Gi
        retentionPolicy: Retain

  service:
    # Pinned because the address ends up written inside the exported
    # kubeconfig: one that moves on reschedule silently breaks the tenant's
    # installer. Address plan: ../../../platform/services/cilium-config/ip-pool.yaml
    annotations:
      io.cilium/lb-ipam-ips: "10.10.100.212"
    spec:
      type: LoadBalancer

  # Renders host-side, so the platform's Prometheus watches this tenant's
  # control-plane health without seeing inside its workloads.
  serviceMonitor:
    enabled: true

# Makes the published kubeconfig usable as-is. Without `server`, vcluster
# advertises https://localhost:8443, which only works through a port-forward
# — useless to an installer that expects a plain ./kubeconfig. vcluster
# writes it to the Secret `vc-recomend` at runtime, not at install time.
exportKubeConfig:
  server: https://10.10.100.212:443
  context: recomend

# NETWORK ISOLATION. Non-negotiable here, more than for any other tenant:
# this one runs the Actions Runner Controller for a PUBLIC repo, so a CI job
# proposed by a stranger executes in its namespace. Verified it needs nothing
# on the home LAN — the hostPath/nfs/hostNetwork hits in its repo are all
# inside the ARC CRD schemas, not actual usage.
#
# What the chart renders, and why a hand-rolled policy could not: see
# ../pave/values.yaml and ../../NETWORK-POLICY.md. publicEgress.except keeps
# the chart default, which already covers 10/8, 172.16/12 and 192.168/16 — so
# the home LAN, the cluster VLAN, the Service CIDR and the pod CIDR in one go.
#
# Not a kernel sandbox: the host namespace is PSA privileged, so anyone who
# can create a pod here can still escape to the node. For a tenant running
# other people's CI that matters — it is an argument for keeping the runner
# out, not something this policy fixes.
policies:
  networkPolicy:
    enabled: true
    controlPlane:
      # The chart allows any destination on 443/8443/6443, which covers the
      # host apiserver. metrics-server is not covered: Service 443 DNATs to
      # 10250 and Cilium judges post-translation. Without this the tenant's
      # metrics API never comes up and every HPA fails — see ../pave/values.yaml.
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: metrics-server
          ports:
            - port: 10250
              protocol: TCP

# Required, not optional: this tenant declares two HorizontalPodAutoscalers
# (web-app and backend/api). Without the proxy, metrics.k8s.io does not exist
# inside the vcluster and ArgoCD reports the whole Application Degraded rather
# than flagging the HPA. nodes: false to match sync.fromHost.nodes above.
integrations:
  metricsServer:
    enabled: true
    nodes: false
    pods: true
