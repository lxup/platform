# Machine-wide budget, 48 Gi total and ~45 Gi allocatable:
#   platform  ~8 Gi    monitoring, Longhorn, Cilium, apiservers
#   homelab   16 Gi    measured at 7.9 Gi with ten apps in
#   pave       4 Gi
#   recomend  10 Gi
# Raising requests here takes it from another tenant — check that first.
#
# REQUESTS are the guardrail: that is what the scheduler reserves. LIMITS are
# deliberately over-committed, because a quota counts declared limits rather
# than usage and this tenant's apps declare generous ones — the original
# 20 Gi limit filled up at ten apps and refused immich's pods outright while
# requests sat at a third of theirs.
#
# A quota whose `hard` sits BELOW current `used` does not fail loudly: it
# just refuses the next pod. limits.cpu was 24 against 40 actually declared,
# which went unnoticed until the vcluster's own control plane was deleted to
# pick up a config change and could not be recreated — the tenant's API went
# down while its workloads, already admitted, kept running. Check
# `kubectl describe resourcequota -n <tenant>` after lowering anything here.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
spec:
  hard:
    requests.cpu: "12"
    requests.memory: 16Gi
    limits.cpu: "64"
    limits.memory: 48Gi
    # Longhorn replicates x2, so every Gi claimed costs 2 Gi of real disk.
    persistentvolumeclaims: "30"
    requests.storage: 200Gi
    count/pods: "80"
    services.loadbalancers: "4"
