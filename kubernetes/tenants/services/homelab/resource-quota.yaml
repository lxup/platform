# Sized against measured reality, not guesswork: the homelab apps
# (Immich + its ML, Jellyfin, Nextcloud, Paperless, Vaultwarden, Syncthing,
# antoinequehec, lxup, and their Postgres instances) use ~8 Gi today on the
# real cluster. On top of that this tenant will carry its own ArgoCD, its
# own Traefik, its own cert-manager and the vcluster control plane itself.
#
# That overhead is smaller than it sounds — measured on the live cluster,
# the whole argocd namespace (controller + repo-server + server + redis +
# dex + applicationset + notifications) is 507 Mi, not the ~1.5 Gi the
# docs' sizing guides imply. Call it ~1.2 Gi for ArgoCD + Traefik +
# cert-manager + the control plane, per tenant.
#
# 20 Gi of limits leaves real headroom; 12 Gi of requests is what actually
# gets reserved against the 45 Gi allocatable.
#
# The vcluster control plane itself is a bigger slice of this than it looks:
# measured at 708 Mi with only this tenant's ArgoCD synced, and its limit was
# raised to 2 Gi because the syncer grows with the object count it tracks
# (see values.yaml). Budget for it, not just for the apps.
#
# Budget across the machine (48 Gi total, ~45 Gi allocatable):
#   platform  ~8 Gi   (monitoring, Longhorn, Cilium, apiservers)
#   homelab   12 Gi   requests  ← this file
#   pave       4 Gi   requests
#   recomend  10 Gi   requests
#   ------------------------------
#   ~34 Gi reserved, ~11 Gi spare
#
# A quota on requests is the one that protects the other tenants; the limits
# quota just stops a single runaway pod. Raise `requests.memory` here and
# you are taking that memory from someone else — check the table above first.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota
  namespace: homelab
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 12Gi
    limits.cpu: "24"
    limits.memory: 20Gi
    # Longhorn volumes are real disk on the EliteDesks, replicated x2 — so
    # every Gi claimed here costs 2 Gi of actual storage. 14 PVCs today.
    persistentvolumeclaims: "30"
    requests.storage: 200Gi
    # A runaway controller in a vcluster can create pods in a tight loop;
    # the host namespace is where that would hurt everyone else.
    count/pods: "80"
    services.loadbalancers: "4"
