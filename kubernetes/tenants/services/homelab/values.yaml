# vcluster values. Schema: `helm show values loft/vcluster --version 0.37.6`
# — the layout changed substantially at 0.20, so do not copy snippets from
# older sources into this file.

sync:
  fromHost:
    # Required. The chart default `auto` only self-enables with the virtual
    # scheduler, which is off, so without this every PVC in the tenant sits
    # Pending. This is what makes `storageClassName: longhorn` work unchanged.
    storageClasses:
      enabled: true
      # Real nodes rather than the chart's fake one, for visibility: this
      # tenant requests gpu.intel.com/i915 (Jellyfin, Immich ML) and
      # debugging a Pending pod is miserable against a fictional node.
      # Scheduling is unaffected either way — the host scheduler places
      # tenant pods. Safe because syncBackChanges stays false.
    nodes:
      enabled: true
      selector:
        # Only nodes this tenant actually has pods on, not the whole fleet.
        all: false
  toHost:
    # The tenant's Ingresses stay inside its vcluster and its own ingress
    # controller serves them. Syncing them to the host would make the
    # tenant's edge depend on a platform ingress controller, which is the
    # coupling this split exists to remove.
    ingresses:
      enabled: false

controlPlane:
  statefulSet:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 1Gi
      limits:
        # Measured: 330 Mi for an empty vcluster, 708 Mi once this tenant's
        # ArgoCD was synced. The syncer grows with the object count it
        # tracks, not with idle size, so a 1Gi limit OOMs partway through a
        # migration. Watch `kubectl top pod -n homelab` when adding apps.
        cpu: "2"
        memory: 2Gi
        ephemeral-storage: 10Gi

    persistence:
      volumeClaim:
        # Holds the tenant's entire control-plane state. Losing it empties
        # its cluster — recoverable from its repo, but it has to be
        # re-bootstrapped. retentionPolicy keeps it through a prune.
        enabled: true
        storageClass: longhorn
        size: 5Gi
        retentionPolicy: Retain

  service:
    # Pinned because the address ends up written inside the exported
    # kubeconfig: one that moves on reschedule silently breaks the tenant's
    # installer. Address plan: ../../../platform/services/cilium-config/ip-pool.yaml
    annotations:
      io.cilium/lb-ipam-ips: "10.10.100.210"
    spec:
      type: LoadBalancer

  # Renders host-side, so the platform's Prometheus watches this tenant's
  # control-plane health without seeing inside its workloads.
  serviceMonitor:
    enabled: true

# Makes the published kubeconfig usable as-is. Without `server`, vcluster
# advertises https://localhost:8443, which only works through a port-forward
# — useless to an installer that expects a plain ./kubeconfig. vcluster
# writes it to the Secret `vc-homelab` at runtime, not at install time.
exportKubeConfig:
  server: https://10.10.100.210:443
  context: homelab
