apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homelab

# No network-policy.yaml. See NETWORK-POLICY.md in this directory — a
# hand-rolled CiliumNetworkPolicy cannot express this correctly, and the
# vcluster chart's own policies.networkPolicy can. Enabling it is a
# phase-1 task; the ResourceQuota is the guardrail until then.
resources:
  - namespace.yaml
  - resource-quota.yaml
  - limit-range.yaml

helmCharts:
  - name: vcluster
    repo: https://charts.loft.sh
    version: 0.37.6
    releaseName: homelab
    namespace: homelab
    valuesFile: values.yaml
