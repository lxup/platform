# Guardrails for the `homelab` tenant, written as DENY rules on purpose.
#
# Cilium has two ways to do this. A normal `egress:` rule flips the
# namespace into default-deny for egress, which means enumerating every
# single thing every app is allowed to reach — Cloudflare, Let's Encrypt,
# container registries, SMTP, the app's own upstreams — and anything
# forgotten breaks silently, at 3am, in a way that looks like a DNS
# problem. `egressDeny` instead subtracts specific destinations from
# otherwise-normal connectivity: nothing that works today stops working,
# and the two things that actually matter are closed.
#
# Needs Cilium >= 1.14 for deny policies; this cluster runs v1.20.2.
#
# What this does NOT do: it does not stop a tenant pod from reaching the
# internet, and it is not a kernel sandbox — a privileged tenant pod is
# privileged on the host (see namespace.yaml). It stops a tenant from
# reaching the home LAN and the cluster's own control plane, which is the
# realistic failure (a compromised dependency, a CI job from a public repo)
# rather than the exotic one.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tenant-guardrails
  namespace: homelab
spec:
  # Every pod in the namespace: the vcluster control plane, its CoreDNS,
  # and every workload pod the syncer creates.
  endpointSelector: {}
  egressDeny:
    # 1. The home LAN — except the NAS, which this tenant legitimately
    #    needs: Nextcloud, Jellyfin, Immich and Paperless all mount
    #    nfs://10.10.10.101 directly in their pod specs, and
    #    nas-passthrough proxies Plex on the same host.
    #
    #    Everything else on 10.10.10.0/24 is off limits: the UDM Pro
    #    (10.10.10.1) and its API, personal laptops, phones, IoT. A tenant
    #    has no business there.
    - toCIDRSet:
        - cidr: 10.10.10.0/24
          except:
            - 10.10.10.101/32 # Unraid NAS — NFS + Plex
    # 2. The cluster VLAN: 10.10.100.2 is the Talos control-plane VIP,
    #    .11-.13 are the nodes' Talos API, and .200-.250 is every
    #    LoadBalancer IP on the machine — the platform's ingress and the
    #    other tenants'.
    - toCIDRSet:
        - cidr: 10.10.100.0/24
    # 3. The host cluster's API server, by Cilium identity rather than by
    #    address. Needed because rule 2 is NOT enough on its own: the
    #    Service CIDR is 10.96.0.0/12 and the host apiserver answers on
    #    10.96.0.1, which rule 2 never touches. That CIDR cannot simply be
    #    denied wholesale — this tenant's own vcluster API and its own
    #    CoreDNS are ClusterIPs in the same range.
    #
    #    STILL OPEN, and deliberately not guessed at: every other ClusterIP
    #    on the host stays reachable from here, including the platform's
    #    Grafana, Prometheus and the Longhorn UI. Closing that needs a
    #    toEndpoints deny on the platform namespaces with an exception for
    #    DNS, and getting it wrong breaks name resolution for the whole
    #    tenant. Validate it against Hubble on a live vcluster in phase 1
    #    before adding it — not from a README.
    - toEntities:
        - kube-apiserver
