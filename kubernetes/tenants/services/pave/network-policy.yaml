# Guardrails for the `pave` tenant. Same egressDeny approach as
# ../homelab/network-policy.yaml (read the rationale there), but STRICTER:
# this tenant has no business on the home LAN at all, so unlike homelab
# there is no NAS exception.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tenant-guardrails
  namespace: pave
spec:
  endpointSelector: {}
  egressDeny:
    # The entire home LAN. No exception: this tenant reaches its data
    # through its own Postgres/object storage inside the vcluster, and
    # everything external it needs (Infisical, Cloudflare, ghcr.io) is on
    # the internet, which is not denied here.
    - toCIDRSet:
        - cidr: 10.10.10.0/24
    # 2. The cluster VLAN: 10.10.100.2 is the Talos control-plane VIP,
    #    .11-.13 are the nodes' Talos API, and .200-.250 is every
    #    LoadBalancer IP on the machine — the platform's ingress and the
    #    other tenants'.
    - toCIDRSet:
        - cidr: 10.10.100.0/24
    # 3. The host cluster's API server, by Cilium identity rather than by
    #    address. Needed because rule 2 is NOT enough on its own: the
    #    Service CIDR is 10.96.0.0/12 and the host apiserver answers on
    #    10.96.0.1, which rule 2 never touches. That CIDR cannot simply be
    #    denied wholesale — this tenant's own vcluster API and its own
    #    CoreDNS are ClusterIPs in the same range.
    #
    #    STILL OPEN, and deliberately not guessed at: every other ClusterIP
    #    on the host stays reachable from here, including the platform's
    #    Grafana, Prometheus and the Longhorn UI. Closing that needs a
    #    toEndpoints deny on the platform namespaces with an exception for
    #    DNS, and getting it wrong breaks name resolution for the whole
    #    tenant. Validate it against Hubble on a live vcluster in phase 1
    #    before adding it — not from a README.
    - toEntities:
        - kube-apiserver
