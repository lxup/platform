# The PLATFORM ingress controller. Its only job in the end state is the
# admin UIs that live on the real cluster: ArgoCD #0, Grafana, Hubble.
# Tenant traffic never passes through here — each tenant runs its own
# Traefik inside its vcluster and gets its own IP out of the same Cilium
# pool (kubernetes/platform/services/cilium-config/ip-pool.yaml).
service:
  type: LoadBalancer
  annotations:
    # ┌─────────────────────────────────────────────────────────────────┐
    # │ MIGRATION: this is 10.10.100.200 TODAY because the homelab apps │
    # │ still run on the real cluster and the UDM Pro forwards 80/443   │
    # │ here. When the homelab tenant goes live in its vcluster, its    │
    # │ Traefik claims .200 (so the UDM forward is never touched) and   │
    # │ THIS value becomes 10.10.100.201. One-line change, and the only │
    # │ ordering rule is: free .200 here before the tenant asks for it, │
    # │ or Cilium hands the tenant a different IP and the port-forward  │
    # │ points at the wrong controller.                                 │
    # └─────────────────────────────────────────────────────────────────┘
    # Pinned rather than left to chance: the UDM Pro port-forward targets a
    # literal IP, so an ingress controller that gets a different address on
    # a reschedule would silently stop receiving public traffic.
    io.cilium/lb-ipam-ips: "10.10.100.200"

ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    http:
      tls:
        enabled: true

ingressClass:
  enabled: true
  isDefaultClass: true

# Traefik refuses to route to ExternalName Services by default since
# v2.4.10 (hardening against a Kubernetes CVE). Kept enabled while the
# homelab apps are still served from here — nas-passthrough/media.yaml
# (Plex, NAS-hosted) backs its Ingress with an ExternalName Service, and
# without this Traefik silently has no router for that host at all
# (generic "404 page not found", easy to mistake for a backend problem).
#
# Once the homelab tenant owns that Ingress, this belongs in the TENANT's
# Traefik values and can be dropped here — no platform admin UI uses an
# ExternalName backend.
providers:
  kubernetesIngress:
    allowExternalNameServices: true
