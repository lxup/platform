# GitOps renders this chart via `kustomize --enable-helm` (= `helm
# template`), which has no real Helm-hook semantics — the pre-upgrade
# check Job gets applied as a plain resource instead of running in order,
# racing the ServiceAccount it needs. Longhorn's own docs say to disable
# it for ArgoCD/GitOps installs.
preUpgradeChecker:
  jobEnabled: false

persistence:
  defaultClass: true
  # 2, not 3 — tolerates 1 node down (same as the rest of this cluster's HA
  # story) without paying full triple storage/write overhead on every
  # single app by default. Real data-loss protection comes from the R2
  # backup target below, not from stacking replicas; apps that genuinely
  # need stronger local durability can request a dedicated StorageClass
  # with a higher count instead of raising the default for everyone.
  defaultClassReplicaCount: 2

defaultSettings:
  defaultDataPath: /var/lib/longhorn
  # false (the real default): Longhorn auto-creates a default disk on every
  # node as it joins, no manual labeling needed. `true` requires manually
  # labeling each node `node.longhorn.io/create-default-disk=true` first —
  # we never did that, so every node sat with zero disks configured and
  # every volume stayed permanently unschedulable.
  createDefaultDiskLabeledNodes: false

defaultBackupStore:
  # S3-compatible target — Cloudflare R2, bucket "homelab". R2 has no real
  # regions; "auto" is Cloudflare's own documented placeholder for S3
  # clients that require one.
  backupTarget: s3://homelab@auto/
  backupTargetCredentialSecret: longhorn-backup-target

# Memory requests for the only two components this chart lets us size.
#
# WHY. Every Longhorn pod shipped with zero memory requests — 31 pods, all
# BestEffort except instance-manager (Burstable, but on CPU only). Eviction
# was never the real risk: they all carry priorityClass `longhorn-critical`
# (priority 1000000000), and node-pressure eviction ranks by priority, so
# they are among the LAST to go. The risk is the SCHEDULER, which sees
# ~3.1 GiB of real Longhorn+ArgoCD usage as free space and overpacks nodes
# accordingly. With tenants being added, that is precisely how a node goes
# from "fine" to evicting.
#
# Calibrated on measured steady usage (max across the 3 nodes), not guessed:
#   longhorn-manager        256 Mi -> 320Mi
#   longhorn-global-manager  37 Mi ->  64Mi
#
# Requests only, deliberately no memory limit. An OOMKill of the manager
# takes down the control plane for every volume on that node, and these are
# exactly the pods whose footprint grows with the cluster's Pod count — the
# chart says so for the global manager (cluster-wide Pod informer cache). A
# limit here would convert organic growth into an outage. Revisit both
# numbers as the tenant count grows.
longhornManager:
  resources:
    requests:
      memory: 320Mi

longhornGlobalManager:
  resources:
    requests:
      memory: 64Mi
