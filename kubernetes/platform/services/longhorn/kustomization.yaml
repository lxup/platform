apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: longhorn-system

resources:
  - namespace.yaml
  - recurring-job.yaml
  # Lets Prometheus reach the manager's metrics — Longhorn's own
  # NetworkPolicy blocks it. See the file for why it lives here and not next
  # to the ServiceMonitor.
  - prometheus-scrape-policy.yaml

generators:
  - ksops-generator.yaml

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.13.0
    releaseName: longhorn
    valuesFile: values.yaml
