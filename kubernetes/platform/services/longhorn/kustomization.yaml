apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: longhorn-system

resources:
  - namespace.yaml
  - recurring-job.yaml
  # Lets Prometheus reach the manager's metrics — Longhorn's own
  # NetworkPolicy blocks it. See the file for why it lives here and not next
  # to the ServiceMonitor.
  - prometheus-scrape-policy.yaml
  # Memory-request floor for the Longhorn pods the chart cannot size —
  # including instance-manager, which is created at runtime and so is
  # reachable by nothing else. See the file for the known gap.
  - limitrange.yaml

generators:
  - ksops-generator.yaml

helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.13.0
    releaseName: longhorn
    valuesFile: values.yaml
