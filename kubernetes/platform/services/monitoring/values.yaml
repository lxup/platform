# kube-prometheus-stack: Prometheus + Grafana + Alertmanager + node-exporter
# (per-node CPU/RAM/disk) + kube-state-metrics (pod/deployment/namespace
# inventory). Resources sized generously, not minimally — 3 nodes with
# 16GB each, barely used cluster-wide, no reason to run this stack on the
# edge of OOM (already happened once with Grafana).
#
# PLATFORM SCOPE, and the one place the tenant split has a real seam.
# This Prometheus sees the physical layer: nodes, Longhorn, Cilium, and —
# because the vcluster syncer creates real pods in the tenants' host
# namespaces — the raw resource usage of tenant pods too. What it does NOT
# see is anything a tenant declares inside its own vcluster: a
# ServiceMonitor there is invisible here, since the CRD lives in the
# tenant's API server.
#
# So: a tenant that wants application dashboards runs a light Prometheus in
# its vcluster (short retention, no Alertmanager — this one alerts) and gets
# added here as an extra Grafana datasource. Do NOT solve it by letting
# tenants write ServiceMonitors into this namespace; that hands every
# tenant a write path into the platform and the boundary is gone.
#
# This stays the single ingress-exposed Grafana for the whole machine.

# CRDs are installed separately in kustomization.yaml (kustomize doesn't
# render a chart's crds/ directory) — stops the chart's own CRD-install Job
# (a Helm hook, meaningless under kustomize rendering) from being applied
# as a plain resource and erroring out.
crds:
  enabled: false

# NO GRAFANA.
#
# Removed deliberately, not by accident. It cost 418 Mi plus a PVC to serve
# dashboards nobody opened — the question "what is Grafana even for, I
# already have Gatus" is its own answer. What was actually missing was not a
# screen but a Telegram message when something breaks, which is what
# Alertmanager now does.
#
# Prometheus stays: it is the data source those alerts are evaluated from,
# and it keeps 15 days of history for answering "why did this restart at
# 3am" — a question Gatus structurally cannot answer. Its own UI is enough
# for that, via
#   kubectl -n monitoring port-forward svc/kube-prometheus-stack-prometheus 9090:9090
#
# Putting Grafana back is flipping this flag plus a LoadBalancer IP from the
# Cilium pool (no ingress controller needed on the platform, see the
# README) — worth doing the day someone actually wants to look at a graph.
#
# `enabled: false` and not merely deleting the block: the chart defaults
# Grafana to ON, so removing the section leaves it running on defaults.
grafana:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  alertmanagerSpec:
    # The whole configuration comes from a SOPS secret rather than from
    # `alertmanager.config` here, because it carries the Telegram bot token
    # and this values file is committed in cleartext. See
    # alertmanager-config.sops.yaml for the routing and why only eleven of
    # the 149 loaded rules reach Telegram.
    configSecret: alertmanager-telegram
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

# Talos is the OS, not a kubeadm distro — these kube-controller-manager /
# kube-scheduler ServiceMonitors target a component endpoint Talos doesn't
# expose the usual way, they'd just sit permanently "down" in Prometheus.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false # Cilium replaces kube-proxy entirely — nothing to scrape
