apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  # Scraping for Longhorn plus the two volume-degradation alerts. Longhorn's
  # own chart ships neither, and Prometheus had zero longhorn_* metrics
  # before this.
  - longhorn-monitoring.yaml
  # Pending/OOMKilled alerts, and the note explaining that the N-1 capacity
  # alert already existed and had been firing into /dev/null for two days
  # because the Alertmanager allowlist did not list it.
  - capacity-monitoring.yaml
  # kustomize's helm inflator silently drops a chart's crds/ directory
  # (known limitation, not specific to this chart) — install Prometheus
  # Operator's CRDs ourselves, pinned to the operator version this chart
  # ships (v0.94.1 in kube-prometheus-stack 91.8.2).
  - https://github.com/prometheus-operator/prometheus-operator/releases/download/v0.94.1/stripped-down-crds.yaml

generators:
  - ksops-generator.yaml

# No dashboards: Grafana is disabled (see values.yaml), so a ConfigMap
# labelled grafana_dashboard=1 would have nothing to discover it.

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 91.8.2
    releaseName: kube-prometheus-stack
    valuesFile: values.yaml
