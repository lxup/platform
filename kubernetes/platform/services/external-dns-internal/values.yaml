# PLATFORM instance. One external-dns process talks to exactly one
# provider, so UniFi means its own Deployment.
#
# It watches Ingresses on the REAL cluster — i.e. only the platform admin
# UIs (ArgoCD #0, Grafana, Hubble). A tenant's Ingress lives inside that
# tenant's vcluster and is invisible from here, so each tenant runs its own
# external-dns. Two instances writing nvlab.fr is safe *because*
# txtOwnerId differs (see below): each one only ever deletes records it
# owns. Give every new tenant a distinct owner id or they will fight over
# the zone and flap each other's records. — one external-dns process talks to exactly one
# provider, so a second provider (UniFi) means a second Deployment, not
# extra config on the first one. Watches the same Ingresses, writes into
# UniFi's local DNS instead of Cloudflare.
provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/home-operations/external-dns-unifi-webhook
      # No semver-tagged images published yet (checked the ghcr.io package
      # listing directly — only `main` and sha256 digests exist today).
      # The project's own README uses `main` too for the same reason.
      tag: main
    env:
      - name: UNIFI_HOST
        value: https://10.10.10.1
      - name: UNIFI_API_KEY
        valueFrom:
          secretKeyRef:
            name: unifi-dns-secret
            key: UNIFI_API_KEY
      - name: UNIFI_SKIP_TLS_VERIFY
        value: "true"
    livenessProbe:
      httpGet:
        path: /healthz
        port: http-webhook
      initialDelaySeconds: 10
      timeoutSeconds: 5
    readinessProbe:
      httpGet:
        path: /readyz
        port: http-webhook
      initialDelaySeconds: 10
      timeoutSeconds: 5

sources:
  - ingress

domainFilters:
  - nvlab.fr

policy: sync
registry: txt
txtOwnerId: platform-internal
interval: 1m

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
