# Dedicated cluster VLAN (10.10.100.0/24, see talos/talconfig.yaml) — this
# is the LoadBalancer range reserved on that VLAN's DHCP (.50-.150), so no
# collision with DHCP-assigned clients.
#
# ONE pool shared by every tenant: a vcluster's LoadBalancer Service is
# synced to the host by its syncer, so Cilium allocates from here for all of
# them. The PLATFORM itself takes nothing — it runs no ingress controller
# and exposes no HTTP (see the README), which is what makes the plan below
# as simple as it is.
#
#   10.10.100.200  homelab tenant's Traefik — the UDM Pro forwards 80/443
#                  here. Direct path, full bandwidth: Jellyfin, Immich and
#                  Nextcloud all need throughput and all exceed
#                  Cloudflare's 100MB proxied-request cap.
#   10.10.100.210  homelab tenant API server
#   10.10.100.211  pave tenant API server
#   10.10.100.212  recomend tenant API server
#
# pave and recomend need no ingress address at all: their ingress is reached
# through their own cloudflared tunnel, which dials OUT to Cloudflare. No
# port-forward, no inbound anything, and their public hostnames never expose
# the home WAN IP.
#
# Because the platform claims nothing here, .200 belongs to the homelab
# tenant from the start — there is no handover to sequence and the UDM
# Pro's port-forward never changes.
#
# Name kept as "homelab-pool" on purpose, even though the repo is now
# "platform": renaming a CiliumLoadBalancerIPPool makes ArgoCD prune and
# recreate it, which reassigns every LoadBalancer IP on the cluster. A
# cosmetic rename is not worth an ingress outage.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: homelab-pool
spec:
  blocks:
    - start: 10.10.100.200
      stop: 10.10.100.250
