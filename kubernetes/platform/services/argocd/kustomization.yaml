# No ksops generator here, unlike every other platform service: the old
# repo-credentials Secret is gone. lxup/platform is a public repo, so
# ArgoCD reads it anonymously — a credential for it would be dead weight
# pointing at the wrong URL.
#
# If this repo ever goes private: create a Secret labeled
# argocd.argoproj.io/secret-type=repository with url/username/password,
# commit it as repo-credentials.sops.yaml, and add a ksops-generator.yaml
# next to it (copy the one in ../cert-manager/).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ingress.yaml
