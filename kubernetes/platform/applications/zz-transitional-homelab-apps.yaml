# ┌───────────────────────────────────────────────────────────────────────┐
# │ TRANSITIONAL — delete this file at the end of the homelab migration.  │
# └───────────────────────────────────────────────────────────────────────┘
#
# Until the homelab tenant actually runs in its vcluster, its apps (Immich,
# Jellyfin, Nextcloud, Paperless, Vaultwarden, Syncthing, antoinequehec,
# lxup, nas-passthrough, Gatus, the public Cloudflare DDNS updater) still
# run directly on the real cluster, exactly as they do today. They used to
# be synced by the single ArgoCD that owned both halves of the old
# lxup/homelab repo; now that this ArgoCD owns the platform repo instead,
# something has to keep syncing them in the meantime — this does.
#
# It reaches ACROSS repos on purpose, which is precisely the coupling the
# split exists to remove. That is fine for a migration window and wrong as
# a steady state. The FILE is named zz-* so it sorts last and stays visibly
# odd; the Application is deliberately NOT.
#
# The Application keeps the name `apps-root` — the exact name the old
# single-repo root already generates, with a byte-identical spec. That makes
# the switchover a no-op for it: the new root finds `apps-root` in its path,
# sees no change, and touches nothing.
#
# Call it `transitional-homelab-apps` instead and the new root prunes
# `apps-root` before creating the new one. The 11 child Applications
# (immich, jellyfin, nextcloud...) survive that — no Application here
# carries resources-finalizer.argocd.argoproj.io, so the delete is
# non-cascading and the apps keep running — but they spend a window
# orphaned, with a tracking-id pointing at an Application that no longer
# exists, waiting to be re-adopted. Zero upside for that risk.
#
# The prerequisite is done: lxup/homelab commit 184b5cc moved external-dns
# and gatus from kubernetes/core/ to kubernetes/apps/, so everything this
# tenant still runs on the real cluster is under the one path below. If you
# ever add something to kubernetes/core/ in that repo during the migration
# window, it will NOT reconcile — put it under kubernetes/apps/.
#
# REMOVAL: once `homelab` the tenant is serving traffic from its vcluster,
# delete this file. ArgoCD prunes every Application it created, which
# removes the duplicate copies from the real cluster's namespaces — so do it
# only AFTER the tenant-side copies are live and verified, never before.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "100"
spec:
  project: default
  source:
    repoURL: https://github.com/lxup/homelab.git
    targetRevision: main
    path: kubernetes/apps/applications
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
