# Config for the platform ArgoCD itself (ArgoCD #0): its LAN-only Ingress
# and its repo credentials. The ArgoCD *install* is not managed here on
# purpose — see bootstrap/argocd/values.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lxup/platform.git
    targetRevision: main
    path: kubernetes/platform/services/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
